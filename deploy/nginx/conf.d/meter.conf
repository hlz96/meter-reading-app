# ============================================================
# Nginx 配置 — 起步阶段:纯 IP + HTTP(无域名/无证书)
# - 80 端口直接服务,不跳 HTTPS
# - / 托管前端静态页(SPA),/api 反代后端,/uploads 托管照片
# 以后有域名+证书时,可还原 meter.conf.https.bak 启用 HTTPS
# ============================================================

server {
    listen 80;
    server_name _;   # 匹配任意主机名/IP,直接用公网 IP 访问

    client_max_body_size 20m;   # 允许上传抄表照片

    # 前端 SPA:静态文件 + 前端路由回退到 index.html
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 抄表照片:Nginx 直接托管本地磁盘文件,不走后端
    location /uploads/ {
        alias /data/uploads/;
        expires 7d;
        access_log off;
    }
}
